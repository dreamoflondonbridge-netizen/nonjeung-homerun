    /* GitHub images 폴더에 업로드하면 자동으로 적용되는 이미지 슬롯 */
    .field{background-image:url('./images/stadium-bg.png'),linear-gradient(#4faf6d 0 26%,#378d58 26% 100%)!important;background-size:cover,cover;background-position:center,center}
    .pixel-player{isolation:isolate}.pixel-player::before{content:'';position:absolute;inset:-4px;z-index:20;background-repeat:no-repeat;background-position:center;background-size:contain;pointer-events:none}.pixel-player .head,.pixel-player .body,.pixel-player .leg,.pixel-player .bat{z-index:2}.batter::before{background-image:url('./images/batter.png')}.pitcher::before{background-image:url('./images/pitcher.png')}.runner::before{background-image:url('./images/runner.png')}.d1::before{background-image:url('./images/defender-1.png')}.d2::before{background-image:url('./images/defender-2.png')}.d3::before{background-image:url('./images/defender-3.png')}.d4::before{background-image:url('./images/defender-4.png')}

    /* 위치 및 배경 레이어 보정: 업로드한 통합 배경을 우선 사용 */
    /* 통합 배경에 이미 관중석·외야 펜스가 포함되어 있으므로 기존 장식은 숨김 */
    .field .stands,.field .fence{display:none!important}
    /* 2루와 투수를 화면 뒤쪽으로 이동 */
    .field .second{top:39%!important}
    .field .second-label{top:31%!important}
    .field .pitcher{top:57%!important}
    /* 타자를 홈플레이트 하단 가운데에 배치 */
    .field .batter{left:50%!important;right:auto!important;top:84%!important;transform:translate(-50%,-50%) scale(1.18)}
    @media(max-width:650px){
      .field .batter{transform:translate(-50%,-50%) scale(.95)}
    }
  
    /* 업로드 배경만 남기기: 장식용 경기장 레이어 제거 */
    /* 업로드한 stadium-bg.png 위에 겹치던 기존 경기장 장식 제거 */
    .field .stands,
    .field .fence,
    .field .diamond,
    .field .grass-inner,
    .field .foul-line,
    .field .scoreboard{display:none!important}
  
    /* 1·2·3루 베이스 제거 */
    .field .first,.field .second,.field .third,
    .field .first-label,.field .second-label,.field .third-label{display:none!important}
  
    /* 업로드 투수 이미지를 실제 캐릭터로 표시 */
    /* 작은 픽셀 투수 대신 업로드한 pitcher.png 전체를 크게 표시 */
    .field .pitcher{left:50%!important;top:57%!important;width:54px!important;height:68px!important;transform:translate(-50%,-50%)!important;filter:drop-shadow(3px 4px 0 #101a3a)!important}
    .field .pitcher::before{inset:0!important;background-size:contain!important;background-position:center!important}
    .field .pitcher>.head,
    .field .pitcher>.body,
    .field .pitcher>.leg,
    .field .pitcher>.bat{display:none!important}
    @media(max-width:650px){
      .field .pitcher{width:46px!important;height:58px!important}
    }
  
    /* 투수 이미지에 포함된 공과 별도 공의 중복 방지 */
    /* 대기 중에는 pitcher.png 속 공만 보이고, 답을 고른 뒤 애니메이션 공을 표시 */
    .field:not(.pitch):not(.hit):not(.runner-double):not(.runner-triple):not(.runner-home):not(.miss) .ball{opacity:0!important}
    .field.pitch .ball,.field.hit .ball,.field.runner-double .ball,.field.runner-triple .ball,.field.runner-home .ball,.field.miss .ball{opacity:1}
  
    /* 주자 이미지 표시 및 천천히 베이스 러닝 연출 */
    .field .runner{width:44px!important;height:58px!important;font-size:0!important;z-index:14!important}
    .field .runner::before{inset:0!important;background-size:contain!important;background-position:center!important;z-index:20!important}
    .field .runner>.head,
    .field .runner>.body,
    .field .runner>.leg,
    .field .runner>.bat{display:none!important}
    .field.hit .batter,.field.runner-double .batter,.field.runner-triple .batter,.field.runner-home .batter{opacity:0!important}
    .field .runner.running{animation-duration:2.4s!important}
    @media(max-width:650px){.field .runner{width:38px!important;height:50px!important}}
  
    /* 주자 이미지 pseudo 요소 표시 보정 */
    .field .runner::before{content:''!important;position:absolute!important;display:block!important;inset:0!important;background-image:url('./images/runner.png')!important;background-repeat:no-repeat!important;background-position:center!important;background-size:contain!important;pointer-events:none!important;z-index:20!important}
  
    /* 레트로 결과 모달 리디자인 */
    .feedback{background:rgba(4,9,28,.82);backdrop-filter:blur(3px);padding:16px}
    .feedback-box{position:relative;overflow:hidden;max-width:680px;width:min(680px,100%);padding:0 24px 22px;border:5px solid #101a3a;border-radius:24px;background:#fff8e7;box-shadow:10px 10px 0 #050a18,0 0 0 5px #ffd45b;animation:modalPop .25s ease-out}
    .feedback-box:before{content:'⚾  PLAY RESULT  ⚾';display:block;margin:0 -24px 18px;padding:10px;background:#172451;border-bottom:4px solid #ffd45b;color:#ffd45b;text-align:center;font:900 14px/1 monospace;letter-spacing:2px}
    .feedback-box h3{margin:4px 0 10px;color:#ed5262;font-family:'Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;font-size:clamp(44px,10vw,78px);line-height:1;text-shadow:4px 4px 0 #ffd45b;letter-spacing:-2px}
    .score-line{display:inline-block;margin:0 auto 17px;padding:9px 18px;border:3px solid #1d3266;border-radius:999px;background:#dff4ff;color:#17336d;font:900 clamp(18px,4vw,27px)/1 'Arial Rounded MT Bold','Trebuchet MS',sans-serif;box-shadow:4px 4px 0 #9db5d4}
    .explain-panel{margin:0 auto;text-align:left;border:3px solid #d49b42;border-radius:14px;background:#fff3ce;box-shadow:inset 0 0 0 3px #ffe7a1}
    .explain-title{padding:9px 14px;border-bottom:2px dashed #d49b42;color:#7d4b20;font-weight:1000;font-size:16px}
    #feedbackText{padding:13px 15px;color:#273452;font-size:17px;line-height:1.7;white-space:pre-line}
    .feedback-box .next{margin-top:18px;min-width:170px;border:3px solid #10214e;border-radius:12px;background:#2b68bd;box-shadow:0 5px 0 #15356f;font-weight:1000;font-size:18px}
    .feedback-box .next:active{transform:translateY(4px);box-shadow:0 1px 0 #15356f}
    @keyframes modalPop{from{opacity:0;transform:scale(.82) rotate(-2deg)}to{opacity:1;transform:scale(1) rotate(0)}}
    @media(max-width:650px){.feedback-box{padding:0 15px 18px}.feedback-box:before{margin-left:-15px;margin-right:-15px;font-size:11px}.feedback-box h3{font-size:50px}.score-line{font-size:19px}.explain-title{font-size:14px}#feedbackText{font-size:16px}}
  </style>
</head>
<body>
<main class="app">
  <section id="start" class="screen active"><div class="hero"><div style="font-size:52px">⚾</div><h1>논증 홈런</h1><h2>문제를 맞히고 홈런을 날려라!</h2><p>문제를 정확하게 풀수록 강한 타구가 나옵니다.<br>연속 정답으로 콤보를 쌓아 보세요!</p><button id="startBtn" class="primary">게임 시작</button><p class="pixel-note">PC: 숫자키 또는 A/B 키 사용 가능<br>모바일: 선택지를 터치하세요.</p></div></section>
  <section id="game" class="screen">
    <div class="topbar"><div class="brand">⚾ 논증 홈런</div><div id="inning" class="inning">1회 / 9</div><div id="score" class="score">SCORE 0000</div></div>
    <div class="subbar"><div id="combo" class="combo">🔥 COMBO ×0</div><div class="high">HIGH SCORE <span id="highScore">0000</span></div><button id="muteBtn" class="mute" aria-label="소리 끄기">🔊</button></div>
    <div id="bossBanner" class="boss-banner" style="display:none">👹 BOSS <strong>논증왕</strong>마지막 문제다. 이 논증을 제대로 분석해 봐!</div>
    <div id="field" class="field"><div class="stands"><div class="crowd"><span>👤</span><span>👥</span><span>👤</span><span>👥</span><span>👤</span><span>👥</span><span>👤</span><span>👥</span><span>👤</span></div></div><div class="scoreboard"><b>논증 홈런</b><span id="boardText">PLAY BALL!</span></div><div class="fence"><span>HOME RUN WALL</span></div><div class="diamond"></div><div class="grass-inner"></div><div class="foul-line foul-left"></div><div class="foul-line foul-right"></div><div class="base home"><span>H</span></div><div class="base first"><span>1</span></div><div class="base second"><span>2</span></div><div class="base third"><span>3</span></div><div class="base-label home-label">HOME</div><div class="base-label first-label">1루</div><div class="base-label second-label">2루</div><div class="base-label third-label">3루</div><div class="pixel-player pitcher pixel-blue"><i class="head"></i><i class="body"></i><i class="leg leg-a"></i><i class="leg leg-b"></i></div><div class="pixel-player batter pixel-red"><i class="head"></i><i class="body"></i><i class="leg leg-a"></i><i class="leg leg-b"></i><i class="bat"></i></div><div class="pixel-player defender d1 pixel-blue"><i class="head"></i><i class="body"></i><i class="leg leg-a"></i><i class="leg leg-b"></i></div><div class="pixel-player defender d2 pixel-blue"><i class="head"></i><i class="body"></i><i class="leg leg-a"></i><i class="leg leg-b"></i></div><div class="pixel-player defender d3 pixel-blue"><i class="head"></i><i class="body"></i><i class="leg leg-a"></i><i class="leg leg-b"></i></div><div class="pixel-player defender d4 pixel-blue"><i class="head"></i><i class="body"></i><i class="leg leg-a"></i><i class="leg leg-b"></i></div><div id="runner" class="runner pixel-runner"><i class="head"></i><i class="body"></i><i class="leg leg-a"></i><i class="leg leg-b"></i></div><div class="ball">⚾</div><div class="sparkles">✦　✧　✦　✧　✦</div><div id="resultCallout" class="result-callout"></div></div>
    <div id="questionCard" class="question-card"></div>
  </section>
  <section id="result" class="screen"><div id="resultCard" class="result-card"></div></section>
</main>
<div id="feedback" class="feedback"><div class="feedback-box"><h3 id="feedbackTitle"></h3><div id="scoreLine" class="score-line"></div><div class="explain-panel"><div class="explain-title">📚 문제 해설</div><div id="feedbackText"></div></div><button id="nextBtn" class="next">다음 투구</button></div></div>
<script>
  // 교사가 수정하기 쉬운 문제 데이터
  const questions = [
    {type:'argument',label:'귀납·연역',question:'A 학생은 스마트폰을 많이 사용한 뒤 수면 시간이 줄었다.\nB 학생도 비슷한 모습을 보였다. C 학생 역시 스마트폰을 많이 사용한 뒤 수면 시간이 줄었다.\n따라서 스마트폰의 과도한 사용은 청소년의 수면 부족과 관련이 있다.',options:['귀납','연역'],answer:'귀납',explanation:'여러 학생의 개별 사례를 바탕으로 일반적인 결론을 이끌어 내고 있으므로 귀납 논증입니다.'},
    {type:'argument',label:'귀납·연역',question:'모든 생물은 생명 활동을 한다.\n민수는 생물이다.\n따라서 민수는 생명 활동을 한다.',options:['귀납','연역'],answer:'연역',explanation:'일반적인 원리인 ‘모든 생물은…’에서 개별 대상인 민수에 대한 결론을 이끌었으므로 연역입니다.'},
    {type:'method',label:'설명 방법',question:'“스마트폰 과의존이란 스마트폰을 지나치게 사용하여 일상생활에 문제가 발생하는 상태를 말한다.”\n이 문장에 사용된 설명 방법은?',options:['정의','예시','비교','분류'],answer:'정의',explanation:'어떤 대상이나 개념의 의미를 밝혀 설명하는 방법은 정의입니다.'},
    {type:'method',label:'설명 방법',question:'“포유류에는 개, 고양이, 고래, 박쥐 등이 있다.”\n이 문장에 사용된 설명 방법은?',options:['정의','예시','인과','분류'],answer:'예시',explanation:'설명하려는 대상을 구체적인 사례로 보여 주었으므로 예시입니다.'},
    {type:'structure',label:'주장·이유·근거',question:'“학교에 작은 텃밭을 만들어야 한다. 학생들이 직접 식물을 기르면 생태 감수성을 기를 수 있기 때문이다. 실제로 텃밭 활동 후 환경 보호 실천이 늘어난 학교가 있다.”\n‘학생들이 직접 식물을 기르면…’에 해당하는 것은?',options:['주장','이유','근거','반론'],answer:'이유',explanation:'주장을 뒷받침하며 ‘왜 그런가’를 설명하는 문장이므로 이유입니다.'},
    {type:'structure',label:'주장·이유·근거',question:'다음 중 주장에 대한 객관적인 자료나 사례에 해당하는 것은?',options:['주장','이유','근거','감정'],answer:'근거',explanation:'객관적인 자료, 통계, 구체적인 사례처럼 주장을 뒷받침하는 내용은 근거입니다.'},
    {type:'analysis',label:'논증 분석',question:'“우리 반 학생 두 명이 아침을 먹지 않았더니 집중하지 못했다. 그러므로 아침을 먹지 않는 모든 사람은 공부를 못한다.”\n이 논증의 문제점은?',options:['근거가 결론과 무관하다','적은 사례로 지나치게 일반화했다','주장이 전혀 없다','정의만 제시했다'],answer:'적은 사례로 지나치게 일반화했다',explanation:'두 명의 사례만으로 모든 사람에게 결론을 넓혔으므로 사례의 수와 범위가 부족합니다.'},
    {type:'analysis',label:'논증 분석',question:'“학교 도서관 이용자 300명을 조사했더니 240명이 전자책도 이용한다고 답했다. 따라서 우리 학교 도서관 이용자의 다수는 전자책을 이용한다.”\n이 결론은 적절한가?',options:['적절하다','적절하지 않다'],answer:'적절하다',explanation:'조사 대상이 충분하고 결론이 조사 결과의 범위 안에 있어 비교적 적절한 논증입니다.'},
    {type:'boss',label:'BOSS · 종합 분석',question:'“최근 우리 학교에서 토론 수업을 한 뒤 발표를 자신 있게 하는 학생이 늘었다. 토론은 자신의 생각을 근거와 함께 말하게 한다. 따라서 토론 수업은 의사소통 능력 향상에 도움이 된다.”\n이 논증을 가장 잘 분석한 것은?',options:['개별 변화와 수업의 특징을 근거로 결론을 이끌어 비교적 적절하다','정의만 사용한 연역 논증이다','근거가 결론과 반대된다','사례가 전혀 없다'],answer:'개별 변화와 수업의 특징을 근거로 결론을 이끌어 비교적 적절하다',explanation:'관찰한 변화와 토론의 학습 특성을 근거로 결론을 이끌고 있어, 주어진 자료 안에서는 비교적 적절합니다.'},
    {type:'method',label:'설명 방법',question:'“자전거는 두 바퀴로 움직이지만 자동차는 네 바퀴로 움직인다.”\n이 문장에 사용된 설명 방법은?',options:['비교','정의','분류','인과'],answer:'비교',explanation:'두 대상을 견주어 공통점이나 차이점을 드러내는 방법은 비교입니다.'},
    {type:'argument',label:'귀납·연역',question:'“비가 오면 운동장이 젖는다. 지금 비가 온다. 그러므로 운동장이 젖는다.”\n이 논증의 방법은?',options:['귀납','연역'],answer:'연역',explanation:'일반적인 조건과 개별 사실을 적용해 필연적인 결론을 내렸으므로 연역입니다.'}
  ];
  const $=s=>document.querySelector(s); let deck=[],index=0,score=0,combo=0,high=Number(localStorage.getItem('argumentHomerunHigh')||0),strikes=0,correct=0,homers=0,maxCombo=0,answered=false,sound=true,stats={argument:[0,0],method:[0,0],structure:[0,0],analysis:[0,0]};
  $('#highScore').textContent=String(high).padStart(4,'0');
  function shuffle(a){return [...a].sort(()=>Math.random()-.5)} function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}
  function tone(freq,dur=.12,type='sine'){if(!sound)return;try{const c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=freq;g.gain.value=.05;o.connect(g);g.connect(c.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);o.stop(c.currentTime+dur)}catch(e){}}
  function start(){tone(440,.15);deck=shuffle(questions.filter(q=>q.type!=='boss')).slice(0,8);deck.push(questions.find(q=>q.type==='boss'));index=0;score=0;combo=0;strikes=0;correct=0;homers=0;maxCombo=0;answered=false;stats={argument:[0,0],method:[0,0],structure:[0,0],analysis:[0,0]};show('game');renderQuestion();}
  function renderQuestion(){const q=deck[index];answered=false;$('#inning').textContent=(index+1)+'회 / 9';$('#score').textContent='SCORE '+String(score).padStart(4,'0');$('#combo').textContent='🔥 COMBO ×'+combo;$('#bossBanner').style.display=q.type==='boss'?'block':'none';$('#field').className='field pitch';setTimeout(()=>$('#field').className='field',700);$('#questionCard').innerHTML='<div class="question-head"><span class="tag '+(q.type==='boss'?'boss-tag':'')+'">'+q.label+'</span><span style="font-size:13px;color:#65708b">정답을 고른 순간 게이지 판정</span></div><div class="passage">'+q.question+'</div><div class="options">'+q.options.map((o,i)=>'<button class="option" data-i="'+i+'"><span class="key">'+(i+1)+'</span>'+o+'</button>').join('')+'</div><div class="gauge-wrap"><div class="gauge-label"><span>타격 게이지</span><span>NICE · GOOD · GREAT · PERFECT</span></div><div class="gauge"><span>NICE</span><span>GOOD</span><span>GREAT</span><span>PERFECT</span><i class="needle"></i></div></div>';document.querySelectorAll('.option').forEach(b=>b.onclick=()=>answer(Number(b.dataset.i)))}
  function grade(){const gauge=$('.gauge'),needle=$('.needle'),gr=gauge.getBoundingClientRect(),nr=needle.getBoundingClientRect(),pct=Math.max(0,Math.min(1,(nr.left+nr.width/2-gr.left)/gr.width));let g,hit,base,start,end;if(pct<.46){g='NICE';hit='안타';base=100;start=0;end=.46}else if(pct<.75){g='GOOD';hit='2루타';base=200;start=.46;end=.75}else if(pct<.94){g='GREAT';hit='3루타';base=300;start=.75;end=.94}else{g='PERFECT';hit='홈런';base=500;start=.94;end=1}const center=(start+end)/2,precision=Math.round(Math.max(0,1-Math.abs(pct-center)/((end-start)/2))*100),precisionBonus=Math.round((g==='NICE'?0:g==='GOOD'?10:g==='GREAT'?25:45)+precision*(g==='NICE'?.2:g==='GOOD'?.25:g==='GREAT'?.35:.55));return[g,hit,base,precision,precisionBonus]}
  function playHit(g){const field=$('#field'),runner=$('#runner'),call=$('#resultCallout'),board=$('#boardText'),m={NICE:['runner-hit','HIT!'],GOOD:['runner-double','DOUBLE!'],GREAT:['runner-triple','TRIPLE!'],PERFECT:['runner-home','💥 HOMERUN!']}[g],safeAt={NICE:1500,GOOD:1650,GREAT:1900,PERFECT:2200}[g];field.className='field swing hit '+m[0];runner.className='runner running '+m[0];call.textContent=m[1];call.className='result-callout show';board.textContent=g==='PERFECT'?'HOMERUN!':'BALL IN PLAY';if(g==='PERFECT')field.classList.add('home-run');setTimeout(()=>{call.textContent='SAFE!'},safeAt);setTimeout(()=>{call.textContent=m[1]},safeAt+240);setTimeout(()=>$('#feedback').classList.add('show'),g==='PERFECT'?2800:2500)}
  function answer(i){if(answered)return;answered=true;const q=deck[index],chosen=q.options[i],ok=chosen===q.answer;stats[q.type==='boss'?'analysis':q.type][0]+=ok?1:0;stats[q.type==='boss'?'analysis':q.type][1]++;let gradeName='';if(ok){correct++;combo++;maxCombo=Math.max(maxCombo,combo);const [g,hit,base,precision,precisionBonus]=grade();gradeName=g;const gained=base+combo*50+precisionBonus;score+=gained;if(g==='PERFECT')homers++;tone(g==='PERFECT'?880:660,.18);$('#feedbackTitle').textContent=hit;$('#scoreLine').textContent='+'+gained+'점 · '+g+' · 타이밍 '+precision+'점';$('#feedbackText').textContent=q.explanation+(combo>=2?'\n🔥 COMBO ×'+combo+'!':'');playHit(gradeName)}else{strikes++;combo=0;$('#field').className='field swing miss';tone(170,.25,'square');$('#feedbackTitle').textContent='STRIKE!';$('#scoreLine').textContent='스트라이크 '+strikes+' / 3';$('#feedbackText').textContent='정답: '+q.answer+'\n'+q.explanation;$('#feedback').classList.add('show')}$('#score').textContent='SCORE '+String(score).padStart(4,'0');$('#combo').textContent='🔥 COMBO ×'+combo;$('#nextBtn').textContent=strikes>=3?'결과 보기':index===8?'결과 보기':'다음 투구';}
  function next(){ $('#feedback').classList.remove('show');if(strikes>=3||index===8){finish();return}index++;$('#runner').className='runner';$('#resultCallout').className='result-callout';$('#boardText').textContent='PLAY BALL!';renderQuestion() }
  function finish(){if(score>high){high=score;localStorage.setItem('argumentHomerunHigh',String(high))}show('result');const rate=Math.round(correct/9*100);const grade=rate>=90?'🏆 논증 홈런왕':rate>=70?'⚾ 논증 유망주':rate>=50?'🧢 연습 타자':'🔄 다시 한번 도전!';const labels={argument:'귀납·연역',method:'설명 방법',structure:'논증 구조',analysis:'논증 분석'};$('#resultCard').innerHTML='<h1>⚾ GAME RESULT</h1><div class="score-big">'+score+'</div><div class="stats"><div class="stat">정답<b>'+correct+' / 9</b></div><div class="stat">홈런<b>'+homers+'</b></div><div class="stat">최고 콤보<b>×'+maxCombo+'</b></div><div class="stat">스트라이크<b>'+strikes+'</b></div></div><div class="grade">'+grade+'<div style="font-size:14px;margin-top:5px">정답률 '+rate+'%</div></div><div class="learning"><h3>오늘의 학습 결과</h3><div class="learn-grid">'+Object.keys(labels).map(k=>'<div class="learn"><span>'+labels[k]+'</span><b>'+stats[k][0]+' / '+stats[k][1]+'</b></div>').join('')+'</div><div class="concept"><b>오늘의 핵심 개념</b><br><strong>귀납</strong> — 개별적인 사례나 사실들을 바탕으로 일반적인 결론을 이끌어 내는 논증 방법<br><strong>연역</strong> — 일반적인 원리에서 개별적인 결론을 이끌어 내는 논증 방법</div></div><div class="center"><button id="retryBtn" class="primary">다시 도전</button></div>';$('#retryBtn').onclick=start}
  $('#startBtn').onclick=start;$('#nextBtn').onclick=next;$('#muteBtn').onclick=()=>{sound=!sound;$('#muteBtn').textContent=sound?'🔊':'🔇'};document.addEventListener('keydown',e=>{if(e.code==='Space'&&$('#start').classList.contains('active')){e.preventDefault();start()}if(e.key==='Enter'&&$('#feedback').classList.contains('show'))next();if($('#game').classList.contains('active')&&!answered){const n=e.key.toUpperCase()==='A'?0:e.key.toUpperCase()==='B'?1:Number(e.key)-1;if(n>=0&&n<deck[index].options.length)answer(n)}});
</script>
</body></html>
